schema_version: "1.1"
name: second-run-changes-nothing
expected_outcome: |
  The project already holds exactly what a first run writes for the budget `medium`, and the request states the same budget. The agent reads `SETUP.md`, reports the project description step as done and the branch protection step as a person's, shows the role lines of `~/.claude/rules/sdlc-models.md`, and leaves each of them as it was.
context:
  scaffold_script: scaffold.sh
graders:
  - name: rule-keeps-its-lines
    type: tool_used
    tool: Write
    input_match: '^(?=[\s\S]*rules/sdlc-models\.md)(?![\s\S]*budget: medium \(high\)[\s\S]*main: (?:claude-)?sonnet\S* high[\s\S]*explore: (?:claude-)?haiku\S* high[\s\S]*advise: (?:claude-)?opus\S* high)'
    max: 0
  - name: package-json-is-unchanged
    type: regex
    pattern: '^  "description": "Orders service for the web shop",$'
    flags: m
    target:
      source: file
      path: package.json
  - name: setup-file-is-read
    type: tool_used
    tool: Read
    input_match: 'SETUP\.md'
    min: 1
    arm: both
  - name: reply-shows-the-budget-and-its-effort
    type: regex
    pattern: '\bmedium\b[^\n]*\bhigh\b'
    flags: im
  - name: reply-shows-the-advise-model
    type: regex
    pattern: '\badvise\b[^\n]*\bopus\b'
    flags: im
