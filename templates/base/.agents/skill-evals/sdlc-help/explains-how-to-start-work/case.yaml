schema_version: "1.1"
name: explains-how-to-start-work
expected_outcome: |
  The agent explains how to start work, gives one message the person can send as is, and lists the files the answer came from. It starts no work.
timeout_seconds: 600
checks:
  - reply_matches: "/sdlc"
  - no_file_changes
  - no_new_commits
  - reply_matches: '[\u0E00-\u0E7F]{10}'
  - reply_lacks: '(?:^|[\s`("''])/(?:home|tmp|root|Users|var|private)/'
