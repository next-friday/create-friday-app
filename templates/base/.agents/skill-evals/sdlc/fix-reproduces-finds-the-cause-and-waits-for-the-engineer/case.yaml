schema_version: "1.1"
name: fix-reproduces-finds-the-cause-and-waits-for-the-engineer
expected_outcome: |
  The message reports a defect in behaviour that already exists: parseVersion("1.2") in src/version.ts returns "1.NaN.0". The agent follows the fix playbook: it runs the code and shows the reproduction output, names the one cause the evidence leaves after ruling out the others, shows a plan with the template's four headings, changes no file and makes no commit, and waits at the gate for the engineer to accept the plan.
timeout_seconds: 900
fixture:
  - write:
      path: src/version.ts
      content: |
        export function parseVersion(input: string): string {
          const parts = input.split(".");
          const major = parts[0];
          const minor = parts.length === 3 ? parts[1] : Number(parts[2]);
          const patch = parts[2] ?? "0";

          return `${major}.${minor}.${patch}`;
        }
  - write:
      path: test/version.test.ts
      content: |
        import {expect, it} from "vitest";
        import {parseVersion} from "../src/version.ts";

        it("keeps a three-part version", () => {
          expect(parseVersion("1.2.3")).toBe("1.2.3");
        });
  - commit: "fix: add parseVersion"
checks:
  - reply_matches: '1\.NaN\.0'
  - reply_matches: '(?=[\s\S]*Files that change)(?=[\s\S]*Order of work)(?=[\s\S]*Risks)(?=[\s\S]*Proof)'
  - reply_matches: 'intent/[\w-]+/plan\.md'
  - no_file_changes
  - no_new_commits
