schema_version: "1.1"
name: statement-without-command-starts-no-work
expected_outcome: |
  The message is a statement and no command was typed. The agent replies without creating an intent, a file, or a commit.
timeout_seconds: 600
checks:
  - reply_matches: "/sdlc"
  - no_file_changes
  - no_new_commits
  - no_new_branch
  - reply_lacks: '(?:^|[\s`("''])/(?:home|tmp|root|Users|var|private)/'
