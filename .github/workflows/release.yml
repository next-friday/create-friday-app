name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "package.json"
      - ".github/workflows/release.yml"
      - ".github/actions/setup-pnpm/action.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  select-mode:
    name: Detect Release Mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
      - name: Select Changesets mode
        id: select
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version Package
    needs: select-mode
    if: ${{ needs.select-mode.outputs.mode == 'version' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed by Changesets to create and update the version branch.
      pull-requests: write # Needed by Changesets to create and update the version pull request.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
        with:
          install: false
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create or update Version Package PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "chore(release): version package"
          pr-title: "chore(release): version package"

  pack:
    name: Pack
    needs: select-mode
    if: ${{ needs.select-mode.outputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
      - name: Verify release commit
        run: pnpm verify
      - name: Pack publishable package
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish
    needs:
      - select-mode
      - pack
    if: ${{ needs.select-mode.outputs.mode == 'publish' && needs.pack.result == 'success' }}
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write # Needed by Changesets to create the GitHub release.
      id-token: write # Needed for npm trusted publishing.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
        with:
          install: false
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Configure npm registry for OIDC publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Publish to npm and create GitHub release
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
