schema_version: "1.1"
name: build-plans-and-waits-for-the-engineer
expected_outcome: |
  The spec intent/app-version/spec.md is merged and has no plan, and the request already holds the engineer's answers about the files, the order of work, the tests, and the options ruled out. The agent follows the build playbook: it reads the intent, the spec, and the code, asks no question, shows the plan with the template's four headings, commits intent/app-version/plan.md alone on a new branch with the `Accepted by:` line as the template has it, pushes that branch, changes no file outside intent/, and waits at the gate for the engineer to merge the plan's pull request. It merges nothing.
context:
  scaffold_script: scaffold.sh
graders:
  - name: reply-has-plan-headings
    type: regex
    pattern: '(?=[\s\S]*Files that change)(?=[\s\S]*Order of work)(?=[\s\S]*Risks)(?=[\s\S]*Proof)'
    flags: mu
  - name: plan-keeps-the-placeholder
    type: regex
    pattern: '^Accepted by: @<engineer>\.$'
    flags: mu
    target:
      source: file
      path: intent/app-version/plan.md
  - name: no-merge-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+merge\b|\bpr\s+merge\b'
    min: 0
    max: 0
