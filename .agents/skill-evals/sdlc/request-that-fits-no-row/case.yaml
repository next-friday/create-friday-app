schema_version: "1.1"
name: request-that-fits-no-row
expected_outcome: |
  The request matches no row of the /sdlc table. The agent says which row is closest and why it does not fit, answers in a few lines, and stops. It writes no file and commits nothing.
timeout_seconds: 300
fixture:
  - bare_remote: origin
checks:
  - no_file_changes
  - no_new_commits
  - reply_matches: '[\u0E00-\u0E7F]{10}'
