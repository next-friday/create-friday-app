schema_version: "1.1"
name: work-request-is-sent-to-sdlc
expected_outcome: |
  The message asks for work. The agent says to send it with /sdlc and changes nothing.
timeout_seconds: 600
checks:
  - reply_matches: "/sdlc"
  - no_file_changes
  - no_new_commits
  - reply_matches: '[\u0E00-\u0E7F]{10}'
  - reply_lacks: '(?:^|[\s`("''])/(?:home|tmp|root|Users|var|private)/'
