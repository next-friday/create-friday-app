schema_version: "1.1"
name: build-continues-from-an-accepted-plan
expected_outcome: |
  The plan intent/app-version/plan.md exists on the unmerged branch feat/app-version, and the engineer says it is accepted. The agent checks out that branch, implements the plan, runs the checks under Verifying your work, pushes the branch, opens the pull request, reviews it, and stops at the gate for the code owner. It neither approves nor merges.
context:
  scaffold_script: scaffold.sh
graders:
  - name: branch-is-checked-out
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:checkout|switch)\s+(?:-\S+\s+)*feat/app-version'
    min: 1
  - name: plan-names-the-engineer
    type: regex
    pattern: '^Accepted by: @joe-dev\.$'
    flags: mu
    target:
      source: file
      path: intent/app-version/plan.md
  - name: reply-is-in-thai
    type: regex
    pattern: '[\u0E00-\u0E7F]{10}'
    flags: mu
