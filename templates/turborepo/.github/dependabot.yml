version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Bangkok
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Bangkok
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /apps/app
      - /apps/backoffice
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Bangkok
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: Asia/Bangkok
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
