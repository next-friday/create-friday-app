name: Documentation report
description: Report wrong, stale, or missing documentation.
labels: ["documentation", "needs triage"]
assignees:
  - joetakara
  - next-friday-engineer
body:
  - type: textarea
    id: issue
    attributes:
      label: What is the documentation issue?
      description: "Example: There is incorrect or stale information about the `pnpm verify` command."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Is there any context that might help us understand?
      description: A clear description of any added context that might help us understand.
    validations:
      required: false
  - type: input
    id: page
    attributes:
      label: Which file or page has the problem? Please link to it.
      description: "Example: a file path in the repository such as `README.md`."
    validations:
      required: false
