# Owner: @joetakara @next-friday-engineer. Reason: zizmor flags local composite actions as self-repository reuse. Local actions stay at ./.github/actions.
# Owner: @joetakara @next-friday-engineer. Reason: the consumer smoke test installs the packed CLI tarball outside the lockfile.
# Owner: @joetakara @next-friday-engineer. Reason: preview publishes with pkg-pr-new, which is not trusted publishing.
rules:
  adhoc-packages:
    ignore:
      - ci.yml
  self-repository:
    disable: true
  use-trusted-publishing:
    ignore:
      - preview.yml
