name: OSV-Scanner

on:
  pull_request: {}
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".cursor/**"
  schedule:
    - cron: "37 2 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan
    permissions:
      actions: read # Needed by the reusable workflow to read workflow run metadata.
      contents: read
      security-events: write # Required by the reusable workflow's declared permissions; unused without SARIF upload.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: false
      scan-args: |-
        --lockfile=pnpm-lock.yaml
        --lockfile=requirements.txt:.github/requirements/diff-cover.txt
