schema_version: "1.1"
name: statement-without-command-starts-no-work
expected_outcome: |
  The message is a statement and no command was typed. The agent replies without creating an intent, a file, or a commit.
graders:
  - name: reply-names-the-command
    type: regex
    pattern: "/sdlc:sdlc"
    flags: mu
  - name: no-file-created
    type: file_exists
    path: "**"
    exists: false
  - name: no-file-written
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-file-edited
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-commit-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
  - name: no-branch-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:checkout\s+-[bB]|switch\s+-[cC]|branch\s+[\w-]|worktree\s+add)'
    min: 0
    max: 0
  - name: reply-is-in-thai
    type: regex
    pattern: '[\u0E00-\u0E7F]{10}'
    flags: mu
  - name: reply-has-no-machine-path
    type: regex
    pattern: '(?:^|[\s`("''])/(?:home|tmp|root|Users|var|private)/'
    flags: mu
    match: not_contains
