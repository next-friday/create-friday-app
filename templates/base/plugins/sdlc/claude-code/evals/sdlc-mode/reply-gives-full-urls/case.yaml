schema_version: "1.1"
name: reply-gives-full-urls
expected_outcome: |
  The agent names the pull request by its full URL on the host the person gave, the first line answers the question, and the Now line ends with the URL of the page where the person acts next. It states no state of the pull request that it did not read, and it starts no work.
graders:
  - name: reply-names-the-pull-request-url
    type: regex
    pattern: 'https://github\.com/acme/shop/pull/42\b'
    flags: mu
  - name: first-line-is-the-answer
    type: regex
    pattern: '^\*\*Answer:\*\*'
    flags: mu
  - name: now-line-gives-the-pull-request-url
    type: regex
    pattern: '^\*\*Now:\*\*.*https://github\.com/acme/shop/pull/42[).\]*_]*\s*$'
    flags: mu
  - name: no-file-created
    type: regex
    target: files
    pattern: '^(?!\.git/config\.worktree$|\.git/objects/info/alternates$).+$'
    flags: m
    match: not_contains
