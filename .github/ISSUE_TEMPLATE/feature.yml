name: Feature request
description: Suggest a specific change to @next-friday/create-app.
labels: ["enhancement", "needs triage"]
assignees:
  - joetakara
  - next-friday-engineer
body:
  - type: markdown
    attributes:
      value: |
        Use this form for changes that are ready to evaluate.
        For questions or early ideas, use GitHub Discussions.
  - type: dropdown
    id: scope
    attributes:
      label: Affected area
      description: Select the area this request affects.
      options:
        - Prompts and arguments
        - New stack
        - Generated project
        - Documentation
        - Compatibility / packaging
        - Repository governance
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem or use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest change that solves the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List existing tools or options you considered.
    validations:
      required: false
  - type: checkboxes
    id: breaking
    attributes:
      label: Breaking change
      description: Indicate whether this request changes behavior for existing consumers.
      options:
        - label: This request changes an existing CLI argument, stack, or generated project contract.
