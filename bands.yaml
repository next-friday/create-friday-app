# Detection settings for one metric: the tiers' actions, tools, and routes. `pnpm bands:check <file>` reads this file.
# The metric is this project's to set. Tiers are sample standard deviations from the baseline's mean.
metric: ci_test_failure_rate
baseline: rolling_30d
rules: western_electric
tiers:
  1sigma: {action: log}
  2sigma: {action: diagnose, tools: "Read,Grep,Bash(gh run view *)"}
  3sigma: {action: propose, routes: [pull_request]}
