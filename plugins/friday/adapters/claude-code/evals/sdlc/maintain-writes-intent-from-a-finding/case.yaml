schema_version: "1.1"
name: maintain-writes-intent-from-a-finding
expected_outcome: |
  A job reports that GET /health answers 500 and no person is available. The agent follows the maintain playbook: it diagnoses without changing a source file, writes intent/<change>/intent.md from the template with the error text and where it was seen under Problem, puts an unverified cause under Open questions, pushes a branch, and names the service owner's gate. It asks the person no question.
graders:
  - name: intent-file-exists
    type: file_exists
    path: intent/*/intent.md
  - name: branch-is-checked-out
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:checkout|switch)\s+(?:-\S+\s+)*(?!main$).+'
    min: 1
