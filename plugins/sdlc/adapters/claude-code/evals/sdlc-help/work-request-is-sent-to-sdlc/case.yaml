schema_version: "1.1"
name: work-request-is-sent-to-sdlc
expected_outcome: |
  The message asks for work. The agent says to send it with /sdlc:sdlc-mode and changes nothing.
graders:
  - name: reply-names-the-command
    type: regex
    pattern: "/sdlc:sdlc-mode"
    flags: mu
  - name: no-file-created
    type: regex
    target: files
    pattern: '^(?!\.git/config\.worktree$|\.git/objects/info/alternates$).+$'
    flags: m
    match: not_contains
  - name: no-file-written
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-file-edited
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-commit-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
