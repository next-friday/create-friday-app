name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "package.json"
      - ".github/workflows/release.yml"
      - ".github/actions/setup-pnpm/action.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  select-mode:
    name: Detect Release Mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Select Changesets mode
        id: select
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version Package
    needs: select-mode
    if: ${{ needs.select-mode.outputs.mode == 'version' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed by Changesets to create and update the version branch.
      pull-requests: write # Needed by Changesets to create and update the version pull request.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create or update Version Package PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "chore(release): version package"
          pr-title: "chore(release): version package"

  pack:
    name: Pack
    needs: select-mode
    if: ${{ needs.select-mode.outputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Verify release commit
        env:
          GITHUB_TOKEN: ${{ github.token }} # editorconfig-checker downloads its binary from GitHub releases; the token avoids the anonymous rate limit.
        run: pnpm verify
      - name: Pack publishable package
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  stage:
    name: Stage on npm
    needs:
      - select-mode
      - pack
    if: ${{ needs.select-mode.outputs.mode == 'publish' && needs.pack.result == 'success' }}
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write # Needed to create the release tag and GitHub release.
      id-token: write # Needed for npm trusted publishing.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure npm registry for OIDC staging
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Download packed package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/changeset-pack
      - name: Stage on npm and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_DIR: ${{ runner.temp }}/changeset-pack
        run: |
          release="$(node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const [planPath, notesPath] = process.argv.slice(1);
            const [release, ...others] = JSON.parse(readFileSync(planPath, "utf8")).plan.flat().filter(({ kind }) => kind === "publish");
            if (!release || others.length > 0) throw new Error(`Expected one release in ${planPath}`);
            const [, entry] = readFileSync("CHANGELOG.md", "utf8").split(`\n## ${release.version}\n`);
            if (entry === undefined) throw new Error(`CHANGELOG.md has no entry for ${release.version}`);
            writeFileSync(notesPath, entry.split("\n## ")[0].trim());
            console.log(`v${release.version} ${release.tarball.path} ${release.access} ${release.tag}`);
          ' "$PACK_DIR/publish-plan.json" "$RUNNER_TEMP/release-notes.md")"
          read -r tag tarball access dist_tag <<< "$release"
          tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || tag_status=$?
          if [ "$tag_status" -eq 0 ]; then
            echo "::notice::$tag exists, so this run does not stage it again. A maintainer approves it under Staged Packages on npmjs.com; CONTRIBUTING.md under Releasing covers a rejected version."
            exit 0
          fi
          if [ "$tag_status" -ne 2 ]; then
            exit "$tag_status"
          fi
          npm stage publish "$PACK_DIR/$tarball" --access "$access" --tag "$dist_tag"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
