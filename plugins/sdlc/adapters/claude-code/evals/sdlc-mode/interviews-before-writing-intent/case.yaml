schema_version: "1.1"
name: interviews-before-writing-intent
expected_outcome: |
  The agent restates the goal, picks the plan playbook, and asks numbered questions that each carry a recommended answer. It writes no intent yet.
graders:
  - name: reply-numbers-first-question
    type: regex
    pattern: '^\s*(?:\*\*)?1[.)]'
    flags: mu
  - name: reply-numbers-second-question
    type: regex
    pattern: '^\s*(?:\*\*)?2[.)]'
    flags: mu
  - name: no-commit-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
  - name: no-branch-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:checkout\s+-[bB]|switch\s+-[cC]|branch\s+(?!-{1,2}(?:a|r|v|vv|l|list|show-current|contains|merged|no-merged|all|remotes)\b)[\w-]|worktree\s+add)'
    min: 0
    max: 0
  - name: reply-is-in-thai
    type: regex
    pattern: '[\u0E00-\u0E7F]{10}'
    flags: mu
  - name: reply-has-no-machine-path
    type: regex
    pattern: '(?:^|[\s`("''])/(?:home|tmp|root|Users|var|private)/'
    flags: mu
    match: not_contains
