name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # Needed by paths-filter to inspect pull request changes.
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
      ci_policy: ${{ steps.filter.outputs.ci_policy }}
      full_verification: ${{ steps.mode.outputs.full_verification }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Detect relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/file-filters.yml
      - name: Select verification mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAVY: ${{ steps.filter.outputs.heavy }}
          CI_POLICY: ${{ steps.filter.outputs.ci_policy }}
        run: |
          full_verification=false
          if [[ "$EVENT_NAME" == "push" || ( "$EVENT_NAME" == "pull_request" && "$DRAFT" != "true" && ( "$HEAVY" == "true" || "$CI_POLICY" == "true" ) ) ]]; then
            full_verification=true
          fi

          echo "full_verification=$full_verification" >> "$GITHUB_OUTPUT"

  affected-apps:
    name: Detect Affected Apps
    needs: changes
    if: needs.changes.outputs.full_verification == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"
      - name: Set up Node.js and pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: List affected apps
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            apps="$(bash .github/scripts/affected-apps.sh "origin/$BASE_REF" HEAD)"
          else
            apps="$(bash .github/scripts/affected-apps.sh)"
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  checks:
    name: Static Checks, Tests & Build
    needs:
      - changes
      - affected-apps
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Needed to exchange GitHub OIDC for a Turborepo Remote Cache token.
      pull-requests: read # Needed by plan:check to read who merged the plan's pull request.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/payload
      PAYLOAD_SECRET: ci-only-secret
      APP_URL: http://localhost:3001
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"
      - name: Set up Node.js and pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: Set up Turborepo Remote Cache
        if: vars.TURBO_TEAM != ''
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Scope Turborepo to affected packages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "TURBO_FILTER=--affected" >> "$GITHUB_ENV"
          echo "TURBO_SCM_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
      - name: Check rendered agent rules match .agents/rules
        run: pnpm rules:check
      - name: Check agent gates
        run: pnpm gates:check
      - name: Check plans
        env:
          GH_TOKEN: ${{ github.token }} # plan:check reads who merged the plan's pull request.
        run: pnpm plan:check
      - name: Check bands
        run: pnpm bands:check
      - name: Check lint
        run: pnpm lint:check
      - name: Check formatting
        run: pnpm format:check
        env:
          GITHUB_TOKEN: ${{ github.token }} # editorconfig-checker downloads its binary from GitHub releases; the token avoids the anonymous rate limit.
      - name: Check package.json ordering
        run: pnpm sort-package-json:check
      - name: Check types
        run: pnpm typecheck
      - name: Run Knip
        run: pnpm knip
      - name: Check dependency graph
        run: pnpm depcruise
      - name: Run tests with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Playwright browsers
        env:
          AFFECTED_APPS: ${{ needs.affected-apps.outputs.apps }}
        run: |
          while IFS= read -r app; do
            pnpm --filter "./apps/$app" exec playwright install --with-deps chromium
          done < <(jq --raw-output '.[]' <<< "$AFFECTED_APPS")
      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Check patch coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 -m venv "$RUNNER_TEMP/diff-cover"
          "$RUNNER_TEMP/diff-cover/bin/pip" install --quiet --require-hashes --only-binary=:all: -r .github/requirements/diff-cover.txt
          if [[ -f apps/app/coverage/cobertura-coverage.xml ]]; then
            "$RUNNER_TEMP/diff-cover/bin/diff-cover" apps/app/coverage/cobertura-coverage.xml --compare-branch "origin/$BASE_REF" --fail-under 95 --branch-coverage
          fi
          if [[ -f apps/backoffice/coverage/cobertura-coverage.xml ]]; then
            "$RUNNER_TEMP/diff-cover/bin/diff-cover" apps/backoffice/coverage/cobertura-coverage.xml --compare-branch "origin/$BASE_REF" --fail-under 95 --branch-coverage
          fi

  image:
    name: Container Image (${{ matrix.app }})
    needs:
      - changes
      - affected-apps
    if: (needs.changes.outputs.full_verification == 'true' || github.event_name == 'schedule') && needs.affected-apps.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.affected-apps.outputs.apps) }}
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP: ${{ matrix.app }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/payload
      PAYLOAD_SECRET: ci-only-secret
      APP_URL: http://localhost:3000
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        run: |
          curl --silent --show-error --fail --location --output hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum --check --strict
          chmod +x hadolint
          ./hadolint "apps/$APP/Dockerfile"
      - name: Build image
        run: docker build --file "apps/$APP/Dockerfile" --tag "$APP:ci" .
      - name: Smoke test image
        id: smoke
        run: |
          docker run --detach --name "$APP" --network host --env PORT=3000 --env DATABASE_URL --env PAYLOAD_SECRET --env APP_URL "$APP:ci"
          curl --silent --show-error --fail --retry 15 --retry-delay 1 --retry-all-errors --output /dev/null http://localhost:3000/health
      - name: Show container logs
        if: failure() && steps.smoke.outcome == 'failure'
        run: docker logs "$APP"
      - name: Scan image for vulnerabilities
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --silent --show-error --fail --location --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" trivy
          ./trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$APP:ci"

  deploy-dev:
    name: Deploy to dev
    needs:
      - checks
      - image
    if: ${{ !cancelled() && needs.checks.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.image.result) && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      actions: read # Needed by deploy.yml to find the CI run of the deployed commit.
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      commit_sha: ${{ github.sha }}

  triage:
    name: Triage failed build
    needs:
      - changes
      - affected-apps
      - checks
      - image
    if: failure() && vars.CLAUDE_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # Needed to read the logs of the failed jobs.
      id-token: write # Needed to authenticate the Claude GitHub App with the workflow's OIDC token.
      pull-requests: write # Needed to post the summary on the pull request.
    steps:
      - name: Require a Claude credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [[ -n "$ANTHROPIC_API_KEY" || -n "$CLAUDE_CODE_OAUTH_TOKEN" ]] || { echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY repository secret"; exit 1; }
      - name: Collect the build log
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p out
          for job in $(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate --jq '.jobs[] | select(.conclusion == "failure") | .id'); do
            gh api --allow-escape-sequences "repos/$REPOSITORY/actions/jobs/$job/logs" >> out/build.log
          done
      - name: Triage failed build
        id: triage
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            Read the build log at out/build.log. Identify the most
            likely cause, say whether the failure looks flaky or real, and write a
            three-line summary for the PR thread.
          claude_args: >-
            --model claude-haiku-5-5
            --max-turns 5
            --allowedTools "Read"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"}},"required":["summary"]}'
      - name: Post the summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          SUMMARY: ${{ fromJSON(steps.triage.outputs.structured_output).summary }}
        run: gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$SUMMARY"

  ci:
    name: All Checks
    if: always()
    timeout-minutes: 5
    needs:
      - changes
      - affected-apps
      - checks
      - image
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
