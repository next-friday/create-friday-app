schema_version: "1.1"
name: answers-question-without-writing
expected_outcome: |
  The agent answers why `pnpm verify` runs knip and cites the files it read. It writes no file and makes no commit.
timeout_seconds: 600
checks:
  - reply_matches: "knip"
  - reply_matches: '[\w./-]+\.(?:json|md|ts|ya?ml)'
  - no_file_changes
  - no_new_commits
  - reply_matches: '[\u0E00-\u0E7F]{10}'
  - reply_lacks: '(?:^|[\s`("''])/(?:home|tmp|root|Users|var|private)/'
